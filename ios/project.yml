# XcodeGen tanımı. Kurulum: `brew install xcodegen && xcodegen generate` → SesNot.xcodeproj
name: SesNot
options:
  bundleIdPrefix: com.azhulabs
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: tr

targets:
  SesNot:
    type: application
    platform: iOS
    sources: [PhoneApp, Shared]
    dependencies:
      - target: SesNotWatch
    info:
      path: PhoneApp/Info.plist
      properties:
        CFBundleDisplayName: SesNot
        NSSpeechRecognitionUsageDescription: Saatten gelen kayıtları cihaz üzerinde metne çevirmek için.
        NSMicrophoneUsageDescription: Telefondan veya Bluetooth saat mikrofonundan kayıt almak için.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azhulabs.sesnot
        # Konuşmacı ayrımı: sherpa-onnx.xcframework + SherpaOnnx.swift eklendikten sonra bu satırın
        # yorumunu kaldırın. Bayrak yokken SpeakerDiarizer.isAvailable false döner.
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SESNOT_DIARIZATION

  SesNotWatch:
    # watchOS 7+ tek hedefli SwiftUI uygulaması (WatchKit uzantısı yok).
    type: application
    platform: watchOS
    sources: [WatchApp, Shared]
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: SesNot
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.azhulabs.sesnot
        WKRunsIndependentlyOfCompanionApp: true
        NSMicrophoneUsageDescription: Sesli not ve toplantı kaydı almak için.
        WKBackgroundModes: [self-care]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azhulabs.sesnot.watchkitapp
